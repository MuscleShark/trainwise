line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[lint]
# E/F: pycodestyle errors and pyflakes (bugs like unused or undefined names).
# I: import sorting.
select = ["E", "F", "I"]

[lint.per-file-ignores]
# The exercise catalog is a data table with one exercise per line.
"catalog.py" = ["E501"]
"template_catalog.py" = ["E501"]
