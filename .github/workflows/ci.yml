name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A new push to the same branch or PR cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      # ClerkProvider needs the publishable key to prerender pages. It is public
      # (it ships in the browser bundle), so it is a repository variable.
      - name: Build frontend
        run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}

  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    # The tests run on SQLite with coverage, then again on PostgreSQL, the production
    # database (row locks, JSON and time zones behave differently there).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trainwise
          POSTGRES_PASSWORD: trainwise
          POSTGRES_DB: trainwise_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trainwise"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with Ruff
        run: ruff check --output-format=github .

      - name: Compile backend
        run: python -m compileall -q .

      - name: Run API tests with coverage
        run: pytest -q --cov --cov-report=term --cov-fail-under=90

      - name: Run API tests on PostgreSQL
        run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://trainwise:trainwise@localhost:5432/trainwise_test

      - name: Add coverage to job summary
        if: ${{ !cancelled() }}
        run: |
          echo "## Backend coverage" >> "$GITHUB_STEP_SUMMARY"
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true

  infra:
    name: Infrastructure checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js (CDK CLI)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install CDK app dependencies
        working-directory: infra
        run: pip install -r requirements-dev.txt

      - name: Run CDK unit tests
        working-directory: infra
        run: pytest -q

      # Synthesizing the real app catches config mistakes (cdk.json, asset path)
      # without AWS credentials.
      - name: Build Lambda package
        run: backend/scripts/build_lambda.sh

      - name: Synthesize stack
        working-directory: infra
        run: npx --yes aws-cdk@2.1146.1 synth --quiet

  ios:
    name: iOS build and tests
    runs-on: macos-26
    timeout-minutes: 30

    defaults:
      run:
        working-directory: ios

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            ios/IronSageKit/.build
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('ios/**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # The API client is generated from api/openapi.json here, so a contract change
      # that breaks the app fails this step.
      - name: Test IronSageKit
        working-directory: ios/IronSageKit
        run: swift test

      # The OpenAPI generator runs as a package build plugin; CI has no one to
      # click "Trust & Enable", hence -skipPackagePluginValidation.
      - name: Build app for the simulator
        run: >-
          xcodebuild build
          -project IronSage.xcodeproj
          -scheme IronSage
          -destination 'generic/platform=iOS Simulator'
          -skipPackagePluginValidation
          CODE_SIGNING_ALLOWED=NO

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trainwise
          POSTGRES_PASSWORD: trainwise
          POSTGRES_DB: trainwise_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trainwise"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # E2E signs in through the Clerk *development* instance with test emails.
    # The secret key is only used to fetch a testing token that skips bot protection.
    env:
      E2E_DATABASE_URL: postgresql+psycopg://trainwise:trainwise@localhost:5432/trainwise_e2e
      CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: frontend
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
