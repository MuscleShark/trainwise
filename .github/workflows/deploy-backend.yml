name: Deploy backend to staging

# Deploys the backend (infra/, AWS CDK) to staging after CI passes on main, then
# records the commit as passed on staging. Production is updated only by hand, with
# promote-production.yml. The frontend is deployed by Vercel's Git integration.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Pick the commit
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
      latest: ${{ steps.pick.outputs.latest }}
    steps:
      # CI runs can finish out of order. Deploy only main's newest commit, so staging
      # never goes back to an older one; the newer commit's CI run deploys it.
      - name: Check it is main's newest commit
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          main=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          if [ "$SHA" = "$main" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipped $SHA: main has moved on to $main, which deploys after its own CI."
          fi

  deploy:
    name: Deploy to staging
    needs: check
    if: needs.check.outputs.latest == 'true'
    # Only real deploys queue here, so a skipped run never cancels a pending one.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/deploy-stack.yml
    with:
      environment: staging
      stack: TrainWiseApi-staging
      sha: ${{ needs.check.outputs.sha }}
      require-main-head: true
    secrets: inherit

  # The record promote-production.yml checks: a commit status on the commit, linking
  # to this run, which keeps the Lambda package production will deploy.
  record:
    name: Record the commit as passed on staging
    needs: [check, deploy]
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.check.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}"
          -f state=success -f context=deploy/staging -f target_url="$RUN_URL"
          -f description="Deployed to staging and passed the smoke test"
