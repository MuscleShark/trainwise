name: Deploy backend

# Deploys the backend infrastructure and code (infra/, AWS CDK) after CI passes on main.
# The frontend is deployed by Vercel's Git integration.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  CDK_CLI_VERSION: 2.1146.1

jobs:
  deploy:
    name: Deploy with AWS CDK
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.outputs.outputs.function_url }}
    timeout-minutes: 20

    steps:
      - name: Check out the commit that passed CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Must match the Lambda runtime (python3.11).
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js (CDK CLI)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Lambda package
        run: backend/scripts/build_lambda.sh

      - name: Install CDK app dependencies
        working-directory: infra
        run: pip install -r requirements.txt

      # Access keys of the IAM user trainwise-github-deploy. It may only assume the
      # CDK bootstrap roles; those roles do the actual deployment.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      # Where the alarm emails go: the production environment's variable ALARM_EMAIL.
      # Kept out of the repository; without it the alarm topic has no subscriber.
      - name: Show changes
        working-directory: infra
        env:
          ALARM_EMAIL: ${{ vars.ALARM_EMAIL }}
        run: npx --yes "aws-cdk@${CDK_CLI_VERSION}" diff -c "alarmEmail=${ALARM_EMAIL}"

      - name: Deploy
        working-directory: infra
        env:
          ALARM_EMAIL: ${{ vars.ALARM_EMAIL }}
        run: >-
          npx --yes "aws-cdk@${CDK_CLI_VERSION}" deploy
          -c "alarmEmail=${ALARM_EMAIL}"
          --require-approval never
          --outputs-file cdk-outputs.json

      - name: Read stack outputs
        id: outputs
        working-directory: infra
        run: |
          url=$(python3 -c "import json; print(json.load(open('cdk-outputs.json'))['TrainWiseApi']['FunctionUrl'])")
          echo "function_url=$url" >> "$GITHUB_OUTPUT"
          echo "Function URL: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test
        env:
          API_URL: ${{ steps.outputs.outputs.function_url }}
        run: |
          for attempt in 1 2 3 4 5; do
            status=$(curl -s -o response.json -w '%{http_code}' "${API_URL%/}/health" || true)
            if [ "$status" = "200" ]; then
              cat response.json
              exit 0
            fi
            echo "Attempt $attempt: /health returned $status"
            sleep 5
          done
          cat response.json || true
          exit 1
