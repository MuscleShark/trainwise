name: Deploy backend

# Deploys the FastAPI backend to AWS Lambda after CI passes on main.
# The frontend is deployed by Vercel's Git integration.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to AWS Lambda
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.API_URL }}
    timeout-minutes: 15

    env:
      AWS_REGION: us-east-2
      FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME || 'trainwise-api' }}

    steps:
      - name: Check out the commit that passed CI
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Must match the Lambda function's runtime.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build deployment package
        working-directory: backend
        run: |
          mkdir -p build/package
          pip install \
            --platform manylinux2014_x86_64 \
            --implementation cp \
            --python-version 3.11 \
            --only-binary=:all: \
            --target build/package \
            -r requirements.txt
          cp *.py build/package/
          cp -r routers build/package/
          find build/package -name "__pycache__" -type d -prune -exec rm -rf {} +
          (cd build/package && zip -qr ../lambda.zip .)
          ls -lh build/lambda.zip

      # Access keys of the least-privilege IAM user trainwise-github-deploy, stored as
      # production environment secrets. The AWS account's simplified (projects) mode
      # does not allow IAM OIDC providers. Switch to role-to-assume + OIDC if that changes.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update Lambda code
        working-directory: backend
        run: |
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --zip-file fileb://build/lambda.zip \
            --query '{version: Version, size: CodeSize, sha256: CodeSha256}'
          aws lambda wait function-updated-v2 --function-name "$FUNCTION_NAME"

      - name: Smoke test
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          for attempt in 1 2 3 4 5; do
            status=$(curl -s -o response.json -w '%{http_code}' "${API_URL%/}/health" || true)
            if [ "$status" = "200" ]; then
              cat response.json
              exit 0
            fi
            echo "Attempt $attempt: /health returned $status"
            sleep 5
          done
          cat response.json || true
          exit 1
